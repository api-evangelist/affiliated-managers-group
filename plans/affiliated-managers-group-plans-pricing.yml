notes: >-
  Re-checked 2026-08-30. Affiliated Managers Group is a holding company for autonomous
  investment-management firms. It publishes NO API plans and no API pricing page: plan_count is an
  honest zero. AMG does serve two undocumented, anonymously callable site-backing JSON APIs (see
  openapi/), and they are free in the sense that nothing is charged and nothing is sold — there is no
  commercial offer attached to them at all. The plan entry retained below describes the company's
  actual commercial surface, fund-level management and performance fees charged by individual
  Affiliates, not an API product.
