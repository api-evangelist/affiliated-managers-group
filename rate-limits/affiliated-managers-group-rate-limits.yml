  - url: https://wealth.amg.com/wp-json/amgfundsdata/v1/products/funds
    status: 200
    rate_limit_headers: none
    note: Response carried CloudFront cache headers (x-cache, age) and HSTS, but no rate-limit family header.
  - url: https://www.amg.com/wp-json/amginc/v1/affiliates
    status: 200
    rate_limit_headers: none
policies:
  - name: No published rate-limit policy
    description: >-
      Neither AMG site publishes limits, quotas or a fair-use statement for its JSON endpoints, and no
      developer terms cover programmatic use. Consumers should throttle conservatively and cache; the
      full products dataset is roughly 2.4 MB per call and is edge-cached, so repeated polling is both
      expensive and pointless.
