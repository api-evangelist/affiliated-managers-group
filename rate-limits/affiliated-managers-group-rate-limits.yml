source: >-
  live response headers observed on https://wealth.amg.com/wp-json/amgfundsdata/v1/products/funds and
  https://www.amg.com/wp-json/amginc/v1/affiliates, 2026-08-30
notes: >-
  Supersedes the 2026-05-04 bulk-sweep entry, which recorded "AMG does not operate a public developer
  API". That is no longer accurate: AMG serves two undocumented, anonymously callable site-backing JSON
  APIs (see openapi/). What remains true is that AMG documents no rate limit for them and returns no
  rate-limit signal at runtime. limit_count is an honest zero — checked, nothing published.
description: >-
  AMG publishes no rate-limit policy for either site-backing API, and no rate-limit response header was
  observed. An automated consumer has no runtime signal to back off on and must self-throttle.
